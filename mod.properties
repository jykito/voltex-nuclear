# Mod identity, shared by both loader builds (forge-1.20.1 and neoforge-1.21.1 read this file).
mod_id=voltex_nuclear
mod_name=Voltex:Nuclear
mod_version=1.0.1
mod_group_id=com.jykito.voltexnuclear
mod_authors=jykito
mod_license=All Rights Reserved
mod_description=Voltex:Nuclear is an add-on for Voltex: uranium, a fission reactor that works with the Voltex heat network, and a fusion reactor at the top.

# Voltex, the required base mod: the jar in libs/ and the accepted range
voltex_version=3.0.4
voltex_version_range=[3.0.4,4)

# JEI, for the recipe categories (compile only; tools/refresh_libs.js copies the jars from the test instances)
jei_version_forge=15.20.0.132
jei_version_neoforge=19.57.0.451

# KubeJS, for the reactor parts of a pack's startup scripts (compile only; tools/refresh_libs.js copies the jars from the
# local Gradle cache, where the Voltex builds left them). The versions Voltex compiles against.
kubejs_version_forge=2001.6.5-build.26
rhino_version_forge=2001.2.2-build.17
architectury_version_forge=9.1.12
kubejs_version_neoforge=2101.7.2-build.377
rhino_version_neoforge=2101.2.7-build.89
